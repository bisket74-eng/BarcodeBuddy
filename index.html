<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <!-- JsBarcode library for standard barcode generation -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
  <main class="app-container">
    <h1>Barcode Buddy</h1>

    <!-- Input section allowing direct physical keyboard typing -->
    <div class="input-section">
      <input 
        type="text" 
        id="barcodeInput" 
        placeholder="Type or scan barcode number..." 
        autofocus 
        autocomplete="off" 
      />
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <!-- On-screen button panel for mouse/touch interactions -->
    <div class="keypad" id="keypad">
      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
      <button data-val="4">4</button>
      <button data-val="5">5</button>
      <button data-val="6">6</button>
      <button data-val="7">7</button>
      <button data-val="8">8</button>
      <button data-val="9">9</button>
      <button data-val="0">0</button>
      <button id="backspaceBtn">⌫</button>
      <button id="printBtn" class="action-btn">Generate & Print</button>
    </div>

    <!-- Preview area -->
    <div class="preview-section">
      <h2>Preview</h2>
      <div id="printArea" class="label-container">
        <svg id="barcodeSvg"></svg>
        <div id="barcodeNumber" class="barcode-number"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
